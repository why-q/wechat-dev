[project]
name = "wechat-dev-test-rag"
version = "0.1.0"
description = "LlamaIndex-backed RAG for the WeChat callback service and offline CLI"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.12,<1",
    "llama-index-readers-file>=0.5,<1",
    "llama-index-llms-openai-like>=0.4,<1",
    "llama-index-embeddings-openai-like>=0.4,<1",
    "python-dotenv>=1,<2",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[tool.uv]
package = false
