server {
    listen 80;
    listen 443 ssl;
    server_name wechat-dev.llink.cyou;

    ssl_certificate /etc/ssl/nginx/cert.pem;
    ssl_certificate_key /etc/ssl/nginx/key.pem;

    location = /wechat {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        client_max_body_size 256k;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        access_log off;
    }

    location = /relay/wechat {
        proxy_pass http://127.0.0.1:8090/relay/wechat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        client_max_body_size 512k;
        access_log off;
    }

    location = /relay/events {
        proxy_pass http://127.0.0.1:8090/relay/events;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        access_log off;
    }

    location = /relay/send-test {
        proxy_pass http://127.0.0.1:8090/relay/send-test;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        client_max_body_size 64k;
        access_log off;
    }
}
